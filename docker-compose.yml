# Balanceador de carga web con NGINX
# Servicios: NGINX (balanceador) + 3 backends + Artillery + métricas (Prometheus)
name: lb-nginx

# Configuración común de los 3 backends
x-backend: &backend
  build: ./backend
  image: lb-nginx-backend:1.0
  expose:
    - "8080"                  # solo visible dentro de la red Docker, NO en el host
  networks:
    - lb_net
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  nginx:
    image: nginx:1.28-alpine
    container_name: lb-nginx
    # worker_processes se toma de .env
    command: ["nginx", "-g", "daemon off; worker_processes ${NGINX_WORKERS};"]
    ports:
      - "${PUBLIC_PORT}:80"   # único punto de entrada desde el host
    volumes:
      # Configuración montada como volumen (no copiada en la imagen)
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Bloque upstream según la política elegida en .env
      - ./nginx/upstreams/${BALANCE_POLICY}.conf:/etc/nginx/upstream.conf:ro
      # Logs del balanceador en el host, para analizarlos
      - ./logs/nginx:/var/log/nginx
    depends_on:
      backend1: { condition: service_healthy }
      backend2: { condition: service_healthy }
      backend3: { condition: service_healthy }
    networks:
      - lb_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/lb-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend1:
    <<: *backend
    hostname: backend1
    environment:
      BACKEND_NAME: backend1
      WORK_MIN_MS: ${WORK_MIN_MS}
      WORK_MAX_MS: ${WORK_MAX_MS}

  backend2:
    <<: *backend
    hostname: backend2
    environment:
      BACKEND_NAME: backend2
      WORK_MIN_MS: ${WORK_MIN_MS}
      WORK_MAX_MS: ${WORK_MAX_MS}

  backend3:
    <<: *backend
    hostname: backend3
    environment:
      BACKEND_NAME: backend3
      WORK_MIN_MS: ${WORK_MIN_MS}
      WORK_MAX_MS: ${WORK_MAX_MS}

  # Pruebas de carga. No arranca con "up": se usa con "docker compose run".
  artillery:
    image: artilleryio/artillery:latest
    profiles: ["test"]
    working_dir: /scripts
    environment:
      ARTILLERY_DISABLE_TELEMETRY: "true"
    volumes:
      - ./artillery:/scripts:ro
      - ./results:/results
    networks:
      - lb_net

  # ---- Métricas (opcional pero valorado) ----
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    command: ["--nginx.scrape-uri=http://nginx/nginx_status"]
    depends_on:
      - nginx
    networks:
      - lb_net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT}:9090"
    depends_on:
      - nginx-exporter
    networks:
      - lb_net
    restart: unless-stopped

networks:
  lb_net:
    name: lb_net              # red personalizada con nombre explícito
    driver: bridge
