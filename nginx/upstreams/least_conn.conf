# LEAST CONNECTIONS
# Envía cada petición al backend que tenga menos conexiones activas
# en ese momento. Útil cuando las peticiones tardan tiempos distintos.

# Nombre de la política activa (se devuelve en la cabecera X-Balance-Policy)
map "" $balance_policy {
    default "least_conn";
}

upstream backend_pool {
    least_conn;
    # max_fails / fail_timeout: si un backend falla 3 veces en 10 s,
    # se marca como caído durante 10 s y deja de recibir tráfico.
    server backend1:8080 max_fails=3 fail_timeout=10s;
    server backend2:8080 max_fails=3 fail_timeout=10s;
    server backend3:8080 max_fails=3 fail_timeout=10s;

    # Conexiones persistentes reutilizables hacia los backends
    keepalive 64;
}
