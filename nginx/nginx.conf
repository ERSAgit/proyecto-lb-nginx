# Configuración del balanceador de carga.
# worker_processes NO va aquí: se pasa desde .env (NGINX_WORKERS) con "nginx -g".
pid /var/run/nginx.pid;

events {
    worker_connections 4096;   # conexiones por worker (cliente + upstream)
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formato de log para analizar la distribución de peticiones por backend
    log_format balanceo '$remote_addr [$time_local] "$request" $status '
                        'backend=$upstream_http_x_backend upstream=$upstream_addr '
                        'upstream_status=$upstream_status rt=$request_time '
                        'urt=$upstream_response_time';

    access_log /var/log/nginx/access.log balanceo;
    error_log  /var/log/nginx/error.log warn;

    # Bloque upstream con la política elegida en .env (BALANCE_POLICY).
    # docker-compose.yml monta aquí nginx/upstreams/<política>.conf
    include /etc/nginx/upstream.conf;

    server {
        listen 80;

        location / {
            proxy_pass http://backend_pool;

            # Conexiones persistentes hacia los backends
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Tiempos de espera ante backends lentos o caídos
            proxy_connect_timeout 2s;
            proxy_send_timeout    5s;
            proxy_read_timeout    5s;

            # Reintentos: si un backend falla, la petición pasa al siguiente
            proxy_next_upstream         error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries   3;
            proxy_next_upstream_timeout 10s;

            # Cabeceras para ver desde el cliente qué pasó
            add_header X-Upstream       $upstream_addr always;
            add_header X-Balance-Policy $balance_policy always;
        }

        # Métricas en tiempo real (módulo stub_status)
        location = /nginx_status {
            stub_status;
            access_log off;
        }

        # Health check del propio balanceador
        location = /lb-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
