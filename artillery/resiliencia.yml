# Carga constante de 90 s para la prueba de resiliencia.
# Durante la prueba, el script scripts/prueba_resiliencia.sh elimina
# un backend y luego lo vuelve a crear.
config:
  target: "http://nginx"
  phases:
    - name: "Carga constante"
      duration: 90
      arrivalRate: 50
  http:
    timeout: 10

scenarios:
  - name: "Llamada a la API"
    flow:
      - get:
          url: "/api/work"
